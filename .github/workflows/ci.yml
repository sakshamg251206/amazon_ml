name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check resolver tests
      - run: pytest -q
      - name: Demo build and submission check
        run: |
          python -m resolver synth --scale 0.2
          python -m resolver train --data data/demo/train
          python -m resolver resolve --data data/demo/test --out output/ci
          python student_resource/utils/validate_submission.py -m output/ci/matching_results.tsv -c output/ci/candidate_pairs.tsv -t data/demo/test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t entity-resolver .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name er entity-resolver
          for i in $(seq 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/match -H 'Content-Type: application/json' \
            -d '{"name":"Sharma Textiles Pvt Ltd","address":"12 MG Road, Pune","country":"India"}' | head -c 300
