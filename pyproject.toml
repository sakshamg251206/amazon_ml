[project]
name = "entity-resolver"
version = "2.0.0"
description = "Business entity resolution across noisy multi-source records (Amazon ML Challenge 2026)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["experiments", "competition", "student_resource"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
